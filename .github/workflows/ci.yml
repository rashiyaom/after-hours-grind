name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint frontend and shared files
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Run backend integration tests
        run: npm run test
        working-directory: backend

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: npm run build
        working-directory: backend
